name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.9.0 or 0.9.0-beta.2 (a dash makes it a pre-release)"
        required: true
      publish:
        description: "Publish a GitHub Release (creates the tag v<version> on the commit this runs on)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          V="$INPUT_VERSION"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then echo "Not a version: $V"; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Test
        run: dotnet test Miu.sln -c Release
      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./build/package-windows.ps1 -Version $env:VERSION -Out artifacts
      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: build/package-macos.sh "$VERSION" artifacts
      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" APPIMAGE_EXTRACT_AND_RUN=1 build/package-linux.sh "$VERSION" artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: miu-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  # Publishes on a pushed v* tag, or on a manual run with "publish" ticked (then the tag is created on this commit).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag
        id: tag
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then T="v$INPUT_VERSION"; else T="$GITHUB_REF_NAME"; fi
          if ! [[ "$T" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "Not a release tag: $T"; exit 1; fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          if [[ "$T" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
